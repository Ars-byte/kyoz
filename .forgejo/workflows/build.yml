name: Build Kyoz

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: codeberg-small
    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin'

    steps:
      # Este paso debe ir PRIMERO y usar shell puro para evitar dependencias de Node
      - name: Install Node.js and dependencies
        run: |
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ xbps
          xbps-install -yu --repository=https://repo-de.voidlinux.org/current/
          xbps-install -y --repository=https://repo-de.voidlinux.org/current/ nodejs gcc make pkg-config xxd sed coreutils tar

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile project
        run: g++ -std=c++17 -O2 -static -s -o kyo kyo.cpp

      - name: Create tarball
        run: tar -cvf kyoz.tar kyo

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: kyo-package
          path: kyoz.tar